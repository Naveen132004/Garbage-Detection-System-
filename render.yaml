# Render Blueprint for the free plan: a light Python install (ONNX Runtime, no PyTorch)
# that fits in 512 MB. Needs Weights/best.onnx in the repo.
services:
  - type: web
    name: garbage-detection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn app1:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: Weights/best.onnx
      # One shared malloc pool: stops each request thread from keeping its own copy of freed memory
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: garbage_db
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
